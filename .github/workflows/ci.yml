name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint & Helm Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run go vet and Helm lint
        run: |
          make vet
          make helm-lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  test:
    name: Unit & Dual-Era Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run Tier 1 & Tier 2 tests
        run: make test

  build-and-smoke:
    name: Static Binary & Distroless Image Smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build static binaries
        run: make build-all

      - name: Build distroless image & run Tier 3 smoke suite
        run: make test-image
