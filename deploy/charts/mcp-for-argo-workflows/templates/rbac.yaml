{{- if and (eq .Values.argo.mode "kubernetes") .Values.rbac.create -}}
{{- $verbs := list "get" "list" "watch" -}}
{{- if not .Values.rbac.readOnly -}}
{{- $verbs = list "get" "list" "watch" "create" "update" "patch" "delete" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRole" "Role" .Values.rbac.clusterScope }}
metadata:
  name: {{ include "mcp-argo-workflows.fullname" . }}
  {{- if not .Values.rbac.clusterScope }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "mcp-argo-workflows.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtemplates
      - cronworkflows
      - workflowtaskresults
      - workflowtasksets
    verbs: {{ toJson $verbs }}
  {{- if .Values.rbac.clusterScope }}
  - apiGroups: ["argoproj.io"]
    resources:
      - clusterworkflowtemplates
    verbs: {{ toJson $verbs }}
  {{- end }}
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRoleBinding" "RoleBinding" .Values.rbac.clusterScope }}
metadata:
  name: {{ include "mcp-argo-workflows.fullname" . }}
  {{- if not .Values.rbac.clusterScope }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "mcp-argo-workflows.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" .Values.rbac.clusterScope }}
  name: {{ include "mcp-argo-workflows.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-argo-workflows.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
