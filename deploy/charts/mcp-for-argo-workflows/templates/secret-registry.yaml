{{- if and (eq .Values.argo.mode "argo-server") .Values.argo.tokenRegistry.enabled .Values.argo.tokenRegistry.createSecret -}}
{{- if empty .Values.argo.tokenRegistry.entries -}}
{{- fail "argo.tokenRegistry.entries must be non-empty when argo.tokenRegistry.createSecret=true" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-argo-workflows.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-argo-workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.argo.tokenRegistry.secretKey }}: |
    {{- .Values.argo.tokenRegistry.entries | toPrettyJson | nindent 4 }}
{{- end }}
