{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-argo-workflows.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-argo-workflows.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-argo-workflows.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.mcp.port }}
    {{- end }}
{{- end }}
