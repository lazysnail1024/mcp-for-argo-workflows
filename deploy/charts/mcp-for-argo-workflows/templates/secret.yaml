{{- if .Values.secrets.create -}}
{{- if and (not .Values.mcp.allowUnauthenticated) (empty .Values.secrets.mcpAuthToken) -}}
{{- fail "secrets.mcpAuthToken is required when secrets.create=true and mcp.allowUnauthenticated=false (generate one with: openssl rand -hex 32)" -}}
{{- end -}}
{{- $secretName := include "mcp-argo-workflows.secretName" . -}}
{{- $stateKey := .Values.secrets.keys.mcpRequestStateSecret -}}
{{- $stateSecret := .Values.secrets.mcpRequestStateSecret -}}
{{- if empty $stateSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing $existing.data (hasKey $existing.data $stateKey) -}}
{{- $stateSecret = index $existing.data $stateKey | b64dec -}}
{{- else -}}
{{- $stateSecret = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-argo-workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.mcpAuthToken }}
  {{ .Values.secrets.keys.mcpAuthToken }}: {{ .Values.secrets.mcpAuthToken | quote }}
  {{- end }}
  {{ $stateKey }}: {{ $stateSecret | quote }}
  {{- if and (eq .Values.argo.mode "argo-server") .Values.secrets.argoToken }}
  {{ .Values.secrets.keys.argoToken }}: {{ .Values.secrets.argoToken | quote }}
  {{- end }}
{{- end }}
